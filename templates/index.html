<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Météo — carte des températures sur 14 jours</title>
<!-- Feuille de style Leaflet 1.9.4 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  /* La carte occupe toute la fenêtre : c'est l'élément principal de la page */
  #carte { height: 100vh; width: 100%; }
  /* La recherche flotte par-dessus la carte, centrée en haut */
  #recherche {
    position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
    z-index: 1001; display: flex; gap: 0.5rem;
    background: #fff; padding: 0.75rem 1rem; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }
  #ville { padding: 0.5rem; font-size: 1rem; }
  button { padding: 0.5rem 1rem; font-size: 1rem; }
  /* Le message d'erreur flotte sous le formulaire ; invisible quand il est vide */
  #erreur {
    position: fixed; top: 4.5rem; left: 50%; transform: translateX(-50%);
    z-index: 1001; margin: 0; padding: 0.4rem 0.8rem;
    background: #fff; border-radius: 8px; color: #b00; font-size: 0.9rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }
  #erreur:empty { display: none; }
  /* Textes de température posés directement sur la carte (pas d'info-bulle) */
  .temperature-carte, .temperature-recherchee {
    font-weight: bold; text-align: center; white-space: nowrap;
    /* Halo blanc pour rester lisible sur les tuiles claires */
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
  }
  /* Villes affichées en permanence en fond de carte : texte discret */
  .temperature-carte { font-size: 1.05rem; line-height: 20px; }
  /* Ville recherchée : texte plus grand et halo renforcé pour la distinguer */
  .temperature-recherchee {
    font-size: 1.5rem; font-weight: 900; line-height: 30px;
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff,
                 0 0 6px #fff;
  }
  /* En mode nuit, le halo devient noir pour contraster avec le fond sombre */
  body.nuit .temperature-carte, body.nuit .temperature-recherchee {
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
  }
  body.nuit .temperature-recherchee {
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
                 0 0 6px #000;
  }
  /* Mode nuit : thème sombre appliqué quand <body> porte la classe "nuit" */
  body.nuit { background: #121212; }
  body.nuit #recherche { background: #1e1e1e; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); }
  body.nuit #erreur { background: #1e1e1e; color: #ff8080; }
  body.nuit #ville, body.nuit button {
    background: #2a2a2a; color: #eeeeee; border: 1px solid #444444;
  }
  /* Le curseur de date flotte en bas de la page, par-dessus la carte */
  #curseur-conteneur {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    z-index: 1001; display: flex; align-items: center; gap: 0.75rem;
    background: #fff; padding: 0.75rem 1rem; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }
  #curseur-date { width: 280px; }
  #curseur-label { font-size: 0.95rem; min-width: 11rem; text-align: center; }
  body.nuit #curseur-conteneur { background: #1e1e1e; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); }
  body.nuit #curseur-label { color: #eeeeee; }
</style>
</head>
<body>
<!-- Carte plein écran : élément principal de la page -->
<div id="carte"></div>
<!-- Recherche centrée en haut, par-dessus la carte -->
<form id="recherche">
  <input id="ville" placeholder="Nom d'une ville" value="Toulon">
  <button type="submit">Afficher</button>
  <!-- Bouton de bascule du mode nuit : type="button" pour ne pas soumettre le formulaire -->
  <button id="mode-nuit" type="button">Mode nuit</button>
</form>
<!-- Curseur de date flottant en bas de la page : 14 positions, d'il y a 7 jours à dans 6 jours -->
<div id="curseur-conteneur">
  <input type="range" id="curseur-date" min="0" max="13" step="1" value="7">
  <span id="curseur-label"></span>
</div>
<p id="erreur"></p>
<!-- Script Leaflet 1.9.4 -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// La carte est créée une seule fois, dès le chargement de la page
const carte = L.map("carte").setView([46.6, 2.4], 5); // Vue d'ensemble sur la France
// Deux fonds de carte prêts à l'emploi : jour (OpenStreetMap) et nuit (Esri gris foncé)
// Les tuiles sont de simples URL : aucune bibliothèque externe n'est ajoutée
const coucheJour = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
});
// Esri impose l'ordre {z}/{y}/{x} (y avant x) ; ce fond sombre est gratuit et sans clé API
const coucheNuit = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  attribution: '&copy; <a href="https://www.esri.com/">Esri</a>'
});
// Par défaut, c'est le fond de jour qui est affiché
coucheJour.addTo(carte);

// Bascule du mode nuit : on échange les tuiles et on assombrit toute la page
const boutonModeNuit = document.getElementById("mode-nuit");
let modeNuit = false;
boutonModeNuit.addEventListener("click", () => {
  modeNuit = !modeNuit;
  if (modeNuit) {
    carte.removeLayer(coucheJour);
    coucheNuit.addTo(carte);
    document.body.classList.add("nuit");
    boutonModeNuit.textContent = "Mode jour";
  } else {
    carte.removeLayer(coucheNuit);
    coucheJour.addTo(carte);
    document.body.classList.remove("nuit");
    boutonModeNuit.textContent = "Mode nuit";
  }
});

let marqueur = null; // Texte de température de la ville recherchée
let donnees = null; // Dernier relevé reçu du serveur (pour changer de date sans recharger)
let donneesVilles = null; // Relevés des 14 jours de toutes les villes affichées en permanence
// Groupe de couches contenant le texte de température de chaque ville du fond
const groupeVilles = L.layerGroup().addTo(carte);

// Échelle de couleur : -10 °C = bleu pur, 40 °C = rouge pur (interpolation linéaire)
const TEMP_MIN = -10;
const TEMP_MAX = 40;
// Renvoie la couleur du texte pour une température, entre bleu (froid) et rouge (chaud)
function couleurTemperature(temp) {
  let part = (temp - TEMP_MIN) / (TEMP_MAX - TEMP_MIN);
  part = Math.max(0, Math.min(1, part)); // On reste dans l'échelle, même hors bornes
  const rouge = Math.round(255 * part);
  const bleu = Math.round(255 * (1 - part));
  return "rgb(" + rouge + ", 0, " + bleu + ")";
}

// Formate une date au format AAAA-MM-JJ (clés des relevés retournés par l'API)
function versISO(date) {
  const mois = String(date.getMonth() + 1).padStart(2, "0");
  const jour = String(date.getDate()).padStart(2, "0");
  return date.getFullYear() + "-" + mois + "-" + jour;
}

// Le curseur couvre les 14 jours des relevés : index 0 = il y a 7 jours,
// index 7 = aujourd'hui (position par défaut), index 13 = dans 6 jours
const curseur = document.getElementById("curseur-date");
const curseurLabel = document.getElementById("curseur-label");

// Convertit l'index du curseur (0..13) en date ISO, comme les clés des relevés
function dateDepuisIndex(index) {
  const date = new Date();
  date.setDate(date.getDate() + index - 7);
  return versISO(date);
}

// Affiche sous le curseur la date sélectionnée, en toutes lettres
function majLabelCurseur() {
  const date = new Date();
  date.setDate(date.getDate() + Number(curseur.value) - 7);
  curseurLabel.textContent = date.toLocaleDateString("fr-FR", {
    weekday: "long", day: "numeric", month: "long"
  });
}
majLabelCurseur();

// Pose (ou re-pose) le texte de température de la date du curseur sur la carte
function afficherTemperature() {
  const date = dateDepuisIndex(Number(curseur.value));
  const temperature = donnees.releves[date];
  const erreur = document.getElementById("erreur");
  if (temperature === undefined) {
    erreur.textContent = "Pas de relevé pour le " + date + ".";
    return;
  }
  erreur.textContent = "";
  if (marqueur !== null) {
    carte.removeLayer(marqueur);
  }
  marqueur = L.marker([donnees.latitude, donnees.longitude], {
    icon: L.divIcon({
      className: "temperature-recherchee",
      html: '<span style="color:' + couleurTemperature(temperature) + '">'
            + temperature + " °C</span>",
      iconSize: [110, 30],   // Conteneur plus grand que ceux du fond...
      iconAnchor: [55, 15]   // ...ancré au centre, sur l'emplacement de la ville
    })
  }).addTo(carte);
}

// Une ville du fond est « la ville recherchée » si elle se trouve à moins
// d'environ 15 km des coordonnées reçues du serveur (le géocodage est plus
// précis que les coordonnées du fichier villes.json)
function estVilleRecherchee(ville) {
  if (donnees === null) {
    return false;
  }
  const dx = ville.latitude - donnees.latitude;
  const dy = ville.longitude - donnees.longitude;
  return Math.sqrt(dx * dx + dy * dy) < 0.15;
}

// Pose le texte de température de chaque ville du fond, pour la date du
// curseur. La ville recherchée est exclue : elle est affichée à part, en plus grand.
function afficherVilles() {
  if (donneesVilles === null) {
    return;
  }
  groupeVilles.clearLayers();
  const date = dateDepuisIndex(Number(curseur.value));
  for (const ville of donneesVilles) {
    if (estVilleRecherchee(ville)) {
      continue;
    }
    const temperature = ville.releves[date];
    if (temperature === undefined) {
      continue;
    }
    L.marker([ville.latitude, ville.longitude], {
      icon: L.divIcon({
        className: "temperature-carte",
        html: '<span style="color:' + couleurTemperature(temperature) + '">'
              + temperature + " °C</span>",
        iconSize: [70, 20],   // Texte plus discret que celui de la ville recherchée
        iconAnchor: [35, 10]
      })
    }).addTo(groupeVilles);
  }
}

// Au chargement de la page, on récupère les relevés de toutes les villes :
// leurs températures restent affichées en permanence, même après une recherche
fetch("/temperatures-villes").then(reponse => reponse.json()).then(data => {
  donneesVilles = data;
  afficherVilles();
});

document.getElementById("recherche").addEventListener("submit", async (evenement) => {
  evenement.preventDefault();
  const ville = document.getElementById("ville").value.trim();
  const erreur = document.getElementById("erreur");
  erreur.textContent = "";
  const reponse = await fetch("/temperatures?ville=" + encodeURIComponent(ville));
  const data = await reponse.json();
  if (!reponse.ok) {
    erreur.textContent = data.erreur;
    return;
  }
  // On mémorise les relevés : le curseur pourra ainsi changer de date sans nouvelle requête
  donnees = data;
  // Centrer la carte sur la ville recherchée
  carte.setView([data.latitude, data.longitude], 10);
  afficherVilles(); // Le fond exclut désormais la ville recherchée
  afficherTemperature();
});

// Le curseur met à jour les textes dès qu'on le déplace : toutes les villes
// du fond suivent la date choisie, comme la ville recherchée
curseur.addEventListener("input", () => {
  afficherVilles();
  if (donnees !== null) {
    afficherTemperature();
  }
});
</script>
</body>
</html>
