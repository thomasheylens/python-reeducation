<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Météo — températures des 14 jours</title>
<!-- Feuille de style Leaflet 1.9.4 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { font-family: -apple-system, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  form { display: flex; gap: 0.5rem; }
  input { flex: 1; padding: 0.5rem; font-size: 1rem; }
  button { padding: 0.5rem 1rem; font-size: 1rem; }
  #carte { height: 300px; margin: 1rem 0; border-radius: 8px; }
  ul { list-style: none; padding: 0; }
  li { padding: 0.4rem 0; border-bottom: 1px solid #eee; }
  .erreur { color: #b00; }
</style>
</head>
<body>
<h1>Températures des 14 jours <small>(7 passés, 7 à venir)</small></h1>
<form id="recherche">
  <input id="ville" placeholder="Nom d'une ville" value="Toulon">
  <button type="submit">Afficher</button>
</form>
<p class="erreur" id="erreur"></p>
<div id="carte"></div>
<ul id="resultats"></ul>
<!-- Script Leaflet 1.9.4 -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let carte = null;    // Référence à la carte Leaflet, créée une seule fois
let marqueur = null; // Référence au marqueur actuel

document.getElementById("recherche").addEventListener("submit", async (evenement) => {
  evenement.preventDefault();
  const ville = document.getElementById("ville").value.trim();
  const liste = document.getElementById("resultats");
  const erreur = document.getElementById("erreur");
  liste.innerHTML = "";
  erreur.textContent = "";
  const reponse = await fetch("/temperatures?ville=" + encodeURIComponent(ville));
  const data = await reponse.json();
  if (!reponse.ok) {
    erreur.textContent = data.erreur;
    return;
  }
  // Création de la carte une seule fois, sinon on la recentre
  if (carte === null) {
    carte = L.map("carte").setView([data.latitude, data.longitude], 10);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(carte);
  } else {
    carte.setView([data.latitude, data.longitude], 10);
    // Supprimer l'ancien marqueur s'il existe
    if (marqueur !== null) {
      carte.removeLayer(marqueur);
    }
  }
  // Premier jour des relevés pour l'info-bulle du marqueur
  const premierJour = Object.keys(data.releves)[0];
  const premiereTemp = data.releves[premierJour];
  // Placer le marqueur avec l'info-bulle "ville — date : température °C"
  marqueur = L.marker([data.latitude, data.longitude])
    .addTo(carte)
    .bindPopup(data.ville + " — " + premierJour + " : " + premiereTemp + " °C")
    .openPopup();
  // Afficher la liste des températures
  for (const [jour, temp] of Object.entries(data.releves)) {
    const element = document.createElement("li");
    element.textContent = jour + " : " + temp + " °C";
    liste.appendChild(element);
  }
});
</script>
</body>
</html>
